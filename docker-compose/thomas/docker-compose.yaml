services:
  motors:
    image: thomas
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M
    network_mode: host
    devices:
      - "/dev/spidev0.1"

  camera:
    image: camera
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M
    network_mode: host
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - 'c 81:* rmw'

  lidar:
    image: lidar
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 200M
    network_mode: host
    volumes:
      - /dev:/dev
    device_cgroup_rules:
      - 'c 188:* rmw'
